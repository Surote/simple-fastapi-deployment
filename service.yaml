apiVersion: v1
kind: Service
metadata:
  name: timecheck-service
  labels:
    app: timecheck
spec:
  selector:
    app: timecheck
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: timecheck-service-lw
  labels:
    app: timecheck-lw
spec:
  selector:
    app: timecheck-lw
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
