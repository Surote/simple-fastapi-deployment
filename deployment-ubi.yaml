apiVersion: apps/v1
kind: Deployment
metadata:
  name: timecheck-deployment-ubi
  labels:
    app: timecheck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timecheck
  template:
    metadata:
      labels:
        app: timecheck
    spec:
      containers:
        - name: timecheck-fastapi
          image: quay.io/rh_ee_swongpai/fast-localtime-check:d52838e1ff20e6ef1f92bc2422f98a9f93e7438b
          ports:
            - containerPort: 8000
