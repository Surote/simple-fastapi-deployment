apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: timecheck-route
  labels:
    app: timecheck
spec:
  to:
    kind: Service
    name: timecheck-service
  port:
    targetPort: 8000
  tls:
    termination: edge
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: timecheck-route-lw
  labels:
    app: timecheck-lw
spec:
  to:
    kind: Service
    name: timecheck-service-lw
  port:
    targetPort: 8000
  tls:
    termination: edge

